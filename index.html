<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eeeeee;
        }

        .box {
            width: 900px;
            height: 600px;
            margin: 50px auto;
            display: flex;
            background-color: white;
        }

        .left {
            width: 50%;
            text-align: center;
            padding-top: 70px;
        }

        .left h1 {
            font-size: 32px;
        }

        .social {
            margin: 20px;
        }

        .social i {
            border: 1px solid #ddd;
            border-radius: 46%;
            width: 30px;
            height: 30px;
            padding: px
            
            
        }

        .left p {
            color: #777;
            font-size: 14px;
        }

        input {
            display: block;
            width: 240px;
            padding: 12px;
            margin: 10px auto;
            border: none;
            background-color: #eeeeee;
        }

        .forgot {
            margin: 20px;
        }

        .signin {
            background-color: #ff4b2b;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 45px;
        }

        .right {
            width: 50%;
            background-color: #ff3d2e;
            color: white;
            text-align: center;
            padding-top: 170px;
        }

        .right h1 {
            font-size: 32px;
        }

        .right p {
            font-size: 14px;
            margin: 15px 60px;
        }

        .signup {
            background-color: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 25px;
            padding: 12px 45px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="left">

            <h1>Sign in</h1>

            <div class="social">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-google"></i>
                <i class="fa-brands fa-linkedin-in"></i>
            </div>

            <p>or use your account</p>

            <input type="text" placeholder="Email">

            <input type="password" placeholder="Password">

            <p class="forgot">Forgot your password?</p>

            <button class="signin">SIGN IN</button>

        </div>

        <div class="right">

            <h1>Hello, Friend!</h1>

            <p>Enter your personal details and start your journey with us</p>

            <button class="signup">SIGN UP</button>

        </div>

    </div>

</body>
</html>
