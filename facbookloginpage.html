<!DOCTYPE html>
<html>
<head>
    <title>Facebook Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: Arial;
        }

        .main {
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
        }

        .left {
            width: 500px;
        }

        .left h1 {
            color: #1877f2;
            font-size: 55px;
        }

        .left p {
            font-size: 23px;
            margin-top: 10px;
        }

        .box {
            width: 380px;
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            width: 100%;
            height: 50px;
            margin-bottom: 12px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .login {
            width: 100%;
            height: 50px;
            background: #1877f2;
            color: white;
            border: 0;
            border-radius: 5px;
            font-size: 18px;
        }

        .box a {
            display: block;
            text-align: center;
            margin: 16px;
            color: #1877f2;
            text-decoration: none;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }

        .create {
            display: block;
            margin: auto;
            padding: 14px 20px;
            background: #42b72a;
            color: white;
            border: 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="left">
            <h1>facebook</h1>
            <p>Connect with friends and the world<br>
            around you on Facebook.</p>
        </div>

        <div class="box">

            <input type="text" placeholder="Email or phone number">

            <input type="password" placeholder="Password">

            <button class="login">Login</button>

            <a href="#">Forgot password?</a>

            <hr>

            <button class="create">Create new account</button>

        </div>

    </div>

</body>
</html>
